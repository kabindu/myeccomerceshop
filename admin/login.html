<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="store-page-title" content="Admin sign in">
  <title>Admin sign in</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/store-config.js"></script>
  <script src="/js/branding.js"></script>
  <style>
    :root { color-scheme: light; --navy: #142333; --orange: #ff9900; --teal: #007185; --ink: #17212b; --muted: #6b7785; --line: #dce3e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); background: linear-gradient(135deg, #eef5f5, #fff7eb); font-family: 'DM Sans', Arial, sans-serif; }
    .login-card { width: min(100%, 420px); padding: 42px; background: #fff; border: 1px solid rgba(20, 35, 51, .1); border-radius: 12px; box-shadow: 0 20px 60px rgba(20, 35, 51, .12); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px; background: var(--orange); color: var(--navy); font-weight: 800; object-fit: cover; }
    .brand strong, .brand small { display: block; }
    .brand strong { font-size: 18px; }
    .brand small { margin-top: 3px; color: var(--muted); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 26px; color: var(--muted); }
    label { display: block; margin: 17px 0 7px; font-size: 13px; font-weight: 700; }
    input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fff; font: inherit; }
    input:focus { outline: 3px solid rgba(0, 113, 133, .16); border-color: var(--teal); }
    button { width: 100%; margin-top: 25px; padding: 14px; border: 0; border-radius: 7px; background: var(--navy); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: var(--teal); }
    .error { min-height: 20px; margin: 14px 0 0; color: #b42318; font-size: 13px; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand"><img class="brand-mark" src="/images/logo.svg" alt="Store logo" data-store-logo><div><strong data-store="name">My Store</strong><small>Admin</small></div></div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to manage your catalog.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      const body = Object.fromEntries(new FormData(event.target));
      try {
        const response = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Sign in failed.');
        window.location.href = '/admin/';
      } catch (reason) { error.textContent = reason.message; }
    });
  </script>
</body>
</html>
